[package]
name = "prettypst"
version = "3.2.0"
edition = "2024"
description = "Formatter for Typst"
repository = "https://github.com/antonWetzel/prettypst"
license-file = "LICENSE"
keywords = ["cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = { version = "1.0", default-features = false, features = [
    "display",
    "parse",
    "serde",
] }
typst-syntax = "0.15"

[dev-dependencies]
insta = "1.46.0"

[features]
default = []
print-root = []
